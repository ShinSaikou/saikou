<text x="272.0" y="345" font-size="12" font-variant-numeric="tabular-nums" fill="#f0efec">151 MB</text>
<text x="380" y="274" font-size="13" font-weight="600" fill="#f0efec">Storage after the restore</text>
<text x="380" y="291" font-size="12" fill="#c3c2b7">20,124 entries</text>
<line x1="439.5" y1="300" x2="439.5" y2="354" stroke-width="1" stroke="#3a3a37"/>
<text x="380" y="317" font-size="12" fill="#c3c2b7">Saikou</text>
<path d="M440.0,304.0 h202.0 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-202.0 Z" fill="#3987e5"><title>Saikou 0.0.1: 1,461 MB</title></path>
<text x="652.0" y="317" font-size="12" font-variant-numeric="tabular-nums" fill="#f0efec">1,461 MB</text>
<text x="380" y="345" font-size="12" fill="#c3c2b7">Mihon</text>
<path d="M440.0,332.0 h135.2 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-135.2 Z" fill="#d95926"><title>Mihon v0.21.0: 987 MB</title></path>
<text x="585.2" y="345" font-size="12" font-variant-numeric="tabular-nums" fill="#f0efec">987 MB</text>
<text x="0" y="392" font-size="11" fill="#c3c2b7">Lower is better in every panel.</text>
<text x="0" y="408" font-size="11" fill="#c3c2b7">Mihon restored the eleven smaller backups in 86.5 s in total; Saikou was not timed on them.</text>
<text x="0" y="424" font-size="11" fill="#c3c2b7">Storage was measured before schema 4 dropped unused chapter indexes, about 300 MB at this size.</text>
<text x="0" y="440" font-size="11" fill="#c3c2b7">Mihon v0.20.4 took 246.0 s on the same library update bench. Mihon releases after v0.21.0 were not measured.</text>
<text x="0" y="456" font-size="11" fill="#c3c2b7">Measured 2026-10-14. Android emulator, Pixel 9 profile (API 36, 4 GB), network off. Saikou 0.0.1 release build</text>
<text x="0" y="472" font-size="11" fill="#c3c2b7">against the official Mihon v0.21.0 APK. Library: 20,124 entries and about 3.6 million chapters from one 87 MB</text>
<text x="0" y="488" font-size="11" fill="#c3c2b7">backup; Saikou restored that file, Mihon (which runs out of memory on it) restored the same data split into</text>
<text x="0" y="504" font-size="11" fill="#c3c2b7">eleven backups. Memory and storage were measured after each app&#x27;s restore. One sample per scenario, except the</text>
<text x="0" y="520" font-size="11" fill="#c3c2b7">library update: two runs each, against a local test server that answers in 0.4 to 0.8 s and allows 5 requests</text>
<text x="0" y="536" font-size="11" fill="#c3c2b7">per second per source.</text>
</svg>
