<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="cmp-title cmp-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="cmp-title">Saikou 0.0.1 compared with Mihon v0.21.0</title>
<desc id="cmp-desc">Library update (2,000 entries across 20 sources): Saikou 0.0.1 41.5 s, Mihon v0.21.0 255.3 s. Cold start to library (20,124 entries): Saikou 0.0.1 1.24 s, Mihon v0.21.0 1.78 s. Statistics screen (20,124 entries): Saikou 0.0.1 0.20 s, Mihon v0.21.0 1.38 s. Restore one backup (87 MB file, 20,124 entries): Saikou 0.0.1 139.3 s, Mihon v0.21.0 Runs out of memory before it starts. Memory with the library open (PSS, 20,124 entries): Saikou 0.0.1 141 MB, Mihon v0.21.0 151 MB. Storage after the restore (20,124 entries): Saikou 0.0.1 1,461 MB, Mihon v0.21.0 987 MB. Lower is better in every panel. Mihon restored the eleven smaller backups in 86.5 s in total; Saikou was not timed on them. Storage was measured before schema 4 dropped unused chapter indexes, about 300 MB at this size. Mihon v0.20.4 took 246.0 s on the same library update bench. Mihon releases after v0.21.0 were not measured.</desc>
<rect x="0" y="4" width="12" height="12" rx="3" fill="#3987e5"/>
<text x="18" y="14.5" font-size="13" fill="#f0efec">Saikou 0.0.1</text>
