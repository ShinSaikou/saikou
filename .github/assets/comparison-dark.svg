<path d="M60.0,304.0 h188.4 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-188.4 Z" fill="#3987e5"><title>Saikou 0.0.1: 141 MB</title></path>
<text x="258.4" y="317" font-size="12" font-variant-numeric="tabular-nums" fill="#f0efec">141 MB</text>
<text x="0" y="345" font-size="12" fill="#c3c2b7">Mihon</text>
