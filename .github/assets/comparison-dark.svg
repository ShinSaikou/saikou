<text x="141" y="14.5" font-size="13" fill="#f0efec">Mihon v0.21.0</text>
<text x="0" y="50" font-size="13" font-weight="600" fill="#f0efec">Library update</text>
<text x="0" y="67" font-size="12" fill="#c3c2b7">2,000 entries across 20 sources</text>
<line x1="59.5" y1="76" x2="59.5" y2="130" stroke-width="1" stroke="#3a3a37"/>
<text x="0" y="93" font-size="12" fill="#c3c2b7">Saikou</text>
